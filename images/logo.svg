<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="samouGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#E5A855" />
      <stop offset="70%" stop-color="#C98B3A" />
      <stop offset="100%" stop-color="#9A621E" />
    </linearGradient>
    <linearGradient id="samouEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0A1B16" />
    </linearGradient>
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- شعار الأيقونة الملكية: التاج الملكي + درع السمو + قطرة العطر + حرف S -->
  <g transform="translate(10, 10)">
    <!-- الدائرة الخارجية والدرع -->
    <circle cx="50" cy="50" r="46" fill="#0A1B16" stroke="url(#samouGold)" stroke-width="2.5" />
    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#samouGold)" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    
    <!-- التاج الملكي المصغر -->
    <path d="M36 30 L40 37 L50 26 L60 37 L64 30 L66 42 L34 42 Z" fill="url(#samouGold)" />
    <circle cx="50" cy="24" r="2.2" fill="#FDE68A" />
    <circle cx="36" cy="28" r="1.6" fill="#FDE68A" />
    <circle cx="64" cy="28" r="1.6" fill="#FDE68A" />

    <!-- قطرة العطر / جوهرة السمو مع حرف S الملكي -->
    <path d="M50 42 C42 53 38 60 38 67 C38 74 43.4 80 50 80 C56.6 80 62 74 62 67 C62 60 58 53 50 42 Z" fill="url(#samouEmerald)" stroke="url(#samouGold)" stroke-width="1.5" />
    <text x="50" y="72" font-family="'Playfair Display', 'Cinzel', serif" font-size="22" font-weight="900" fill="url(#samouGold)" text-anchor="middle" font-style="italic">S</text>
  </g>

  <!-- النصوص بالإنجليزية والعربية -->
  <!-- الاسم الإنجليزي الفخم -->
  <text x="125" y="52" font-family="'Playfair Display', 'Cinzel', serif" font-size="34" font-weight="800" letter-spacing="4" fill="#0A1B16">
    SAMOU <tspan fill="url(#samouGold)">ROYALE</tspan>
  </text>
  <!-- الوصف الفاخر بالعربية -->
  <text x="126" y="80" font-family="'Cairo', 'Tajawal', sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#1B4A3C">
    دار سَمْو للعطور الملكية الفاخرة · KSA
  </text>
  <!-- سطر الزخرفة الملكية -->
  <line x1="126" y1="92" x2="380" y2="92" stroke="url(#samouGold)" stroke-width="1.2" opacity="0.8" />
  <circle cx="253" cy="92" r="2.5" fill="#E5A855" />
</svg>
